name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      # Cache what a run downloads, not what it compiles. The IntelliJ Platform archive
      # alone is 1.6 GB and Gradle keeps it in modules-2, while rebuilding this server
      # from cached crate sources costs under a minute and would cost a lot of cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'settings.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all -- --check
        working-directory: server
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: server
      - name: Build and test
        shell: bash
        run: bash ./gradlew check buildPlugin --console=plain
      - name: Verify bundled server
        shell: python
        run: |
          import pathlib, platform, zipfile
          properties = dict(
              (part.strip() for part in line.split("=", 1))
              for line in pathlib.Path("gradle.properties").read_text("utf-8").splitlines()
              if "=" in line and not line.lstrip().startswith("#")
          )
          packages = list(pathlib.Path("build/distributions").glob("*.zip"))
          assert len(packages) == 1, packages
          binary = properties["serverBinary"]
          executable = binary + ".exe" if platform.system() == "Windows" else binary
          with zipfile.ZipFile(packages[0]) as archive:
              entries = [i for i in archive.infolist() if i.filename.endswith("/server/" + executable)]
              assert len(entries) == 1 and entries[0].file_size > 0, entries
              if platform.system() != "Windows":
                  assert (entries[0].external_attr >> 16) & 0o111, "Server is not executable"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ runner.os }}-${{ runner.arch }}
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Drop Gradle's lock files before the cache is saved
        if: always()
        shell: bash
        run: rm -f ~/.gradle/caches/modules-2/*.lock ~/.gradle/caches/modules-2/gc.properties

  # --- template self-test; the template cleanup removes this job ---
  # The cleanup script is what this repository exists to provide, and it fails by
  # raising on an anchor it can no longer find. Run it here, on a copy, so that a
  # reworded README or a renamed class breaks this build instead of someone else's
  # new repository.
  cleanup:
    name: Template cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # The same keys as the build job: the generated project renames the plugin, but it
      # resolves the same platform artifact and the same crates.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'settings.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Apply the cleanup to a copy
        run: |
          mkdir generated
          git archive HEAD | tar -x -C generated
          python3 generated/.github/template-cleanup/cleanup.py acme/my-lang-lsp
      - name: Check what the cleanup produced
        shell: python
        run: |
          import pathlib, re

          root = pathlib.Path("generated")
          properties = dict(
              (part.strip() for part in line.split("=", 1))
              for line in (root / "gradle.properties").read_text("utf-8").splitlines()
              if "=" in line and not line.lstrip().startswith("#")
          )
          assert properties["pluginId"] == "io.github.acme.mylanglsp", properties
          assert properties["serverBinary"] == "my-lang-lsp", properties

          readme = (root / "README.md").read_text("utf-8").splitlines()
          assert readme[0] == "# My Lang Lsp", readme[0]
          assert "## Next steps" in "\n".join(readme)

          # Every class the manifest names has to exist under the moved package.
          manifest = (root / "plugin/src/main/resources/META-INF/plugin.xml").read_text("utf-8")
          classes = re.findall(r'(?:implementation|instance)="([\w.]+)"', manifest)
          assert classes, manifest
          for name in classes:
              source = root / "plugin/src/main/java" / (name.replace(".", "/") + ".java")
              assert source.is_file(), name

          # The cleanup removes itself, this job included.
          assert not (root / ".github/template-cleanup").exists()
          assert not (root / ".github/workflows/template-cleanup.yml").exists()
          workflow = (root / ".github/workflows/ci.yml").read_text("utf-8")
          assert "template self-test" not in workflow
          assert "\n  build:\n" in workflow

          # Nothing may still name this template, apart from the credit to lspf.
          template = re.compile(r"io\.github\.meymchen|lspf-hello|LSPF Hello|lspf-intellij-platform")
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "UPSTREAM.md":
                  continue
              try:
                  text = path.read_text("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              left = [line for line in text.splitlines() if template.search(line)]
              assert not left, (path, left)
      - name: Build and test the generated project
        working-directory: generated
        run: bash ./gradlew check --console=plain
      - name: Drop Gradle's lock files before the cache is saved
        if: always()
        run: rm -f ~/.gradle/caches/modules-2/*.lock ~/.gradle/caches/modules-2/gc.properties
  # --- end template self-test ---
