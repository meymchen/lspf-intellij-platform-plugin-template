[package]
name = "lspf-hello"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "A minimal language server and IntelliJ Platform plugin built with lspf"
publish = false

[dependencies]
lspf = { version = "1.0.0", default-features = false, features = ["stdio"] }
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
